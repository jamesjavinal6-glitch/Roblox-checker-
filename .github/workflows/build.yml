name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev automake libltdl-dev patch lld
          pip install --upgrade pip "setuptools<70" wheel "cython==0.29.36" virtualenv buildozer

      - name: Patch buildozer.spec to auto-accept SDK license
        run: |
          python3 << 'EOF'
          import re
          with open("buildozer.spec", "r", encoding="utf-8") as f:
              text = f.read()
          pattern = r"^\s*#?\s*android\.accept_sdk_license\s*=.*$"
          if re.search(pattern, text, re.M):
              text = re.sub(pattern, "android.accept_sdk_license = True", text, flags=re.M)
          else:
              text = re.sub(r"(\[app\])", r"\1\nandroid.accept_sdk_license = True", text, count=1)
          with open("buildozer.spec", "w", encoding="utf-8") as f:
              f.write(text)
          EOF
          grep -n "accept_sdk_license" buildozer.spec

      - name: Build APK
        run: |
          export BUILDOZER_ALLOW_ORG_TEST_DOMAIN=1
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Checker-APK
          path: bin/*.apk
          if-no-files-found: error
          
